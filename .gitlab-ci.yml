image: node:12.13.0

stages:
  - production

production:
  type: deploy
  stage: production
  image: ruby:latest
  script:
    - cd ./server
    - apt-get update -qy
    - apt-get install -y ruby-dev
    - gem install dpl
    - dpl --provider=heroku --app=salty-garden-80295 --api-key=$HEROKU_API_KEY
  only:
    - master
