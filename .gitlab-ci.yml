image: node:12.13.0

before_script:
    - apt-get update -qy
    - apt-get install -y ruby-dev
    - gem install dpl

stages:
  - production

pages:
  stage: deploy
  script:
    - echo "waiting..."
  artifacts:
    paths:
      - public
  only:
    - master

production:
  type: deploy
  stage: production
  image: ruby:latest
  script:
    - cd ./server
    - dpl --provider=heroku --app=salty-garden-80295 --api-key=$HEROKU_API_KEY
  only:
    - master

