<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <meta name="description" content='Portfolio of Jonathan "Jono" Augustine' />
    <title>Jono Augustine</title>

    <link
      rel="shortcut icon"
      href="./images/favicon-16x16.png"
      type="image/x-icon"
    />

    <link rel="apple-touch-icon" href="./images/favicon-96x96.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto+Slab&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css"
    />
    <link href="./style/index.scss" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <header class="banner">
        <div class="head">
          <section class="intro">
            <h1 class="brand">Jono Augustine</h1>
            <h3 class="tagline">Creating solutions to unsolved problems</h3>
          </section>
          <div id="badges" class="container fluid row">
            <a
              class="badge"
              href="https://github.com/JonoAugustine"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="./images/badge_gitHub.svg"
                alt="GitHub"
                width="110"
                height="28"
              />
            </a>
            <a
              href="http://gitlab.com/JonoAugustine"
              target="_blank"
              rel="noopener noreferrer"
              class="badge"
            >
              <img
                src="./images/badge_gitLab.svg"
                alt="GitLab"
                width="108"
                height="28"
              />
            </a>
            <a
              href="http://www.linkedin.com/in/jonathan-augustine-14678b124/"
              target="_blank"
              rel="noopener noreferrer"
              class="badge"
            >
              <img
                src="./images/badge_linkedin.svg"
                alt="LinkedIn"
                width="125"
                height="28"
              />
            </a>
            <a
              href="./images/JonoAugustineResume.pdf"
              target="_blank"
              rel="noopener noreferrer"
              class="badge"
            >
              <img
                src="./images/badge_resume.svg"
                alt="Resume"
                width="97"
                height="28"
              />
            </a>
          </div>
          <button id="header_scroll" class="scroller">My Projects</button>
          <span class="konami">(try konami)</span>
        </div>
      </header>
      <nav class="navbar">
        <div class="container row">
          <h4>+1-240-423-6950</h4>
          <h4>me@JonoAugustine.com</h4>
        </div>
      </nav>

      <div class="container center fluid" id="page_content">
        <div id="pinkilo-card-container" class="container center row fluid">
          <div class="card pinkilo animated slideInLeft no-info">
            <img
              src="images/pkl-logo-badge.png"
              alt="Pinkilo LLC"
              class="thumbnail"
            />
            <div class="content container">
              <h1>Pinkilo LLC</h1>
              <div class="row links">
                <button
                  onclick="window.open('https:\/\/pinkilo.com', '_blank')"
                >
                  View Live
                </button>
              </div>
              <p>
                Co-founder of Pinkilo LLC, a software consulting & development
                company.
              </p>
            </div>
            <div class="extra"></div>
          </div>
        </div>
        <div id="cards" class="container center row fluid"></div>
      </div>
    </div>

    <script
      src="https://kit.fontawesome.com/b8caab6188.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./js/index.ts"></script>
  </body>
</html>
